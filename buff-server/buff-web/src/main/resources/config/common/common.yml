# 服务器通用配置
server:
  # 端口
  port: 8080
  # 应用上下文路径
  servlet:
    context-path: /
  # 编码配置
  tomcat:
    # URI编码
    uri-encoding: UTF-8
    # 最大连接数
    max-connections: 8192
    # 最大线程数
    max-threads: 200
    # 最小空闲线程数
    min-spare-threads: 10
    # 连接超时时间（毫秒）
    connection-timeout: 20000
    # 请求头最大大小
    max-http-header-size: 8KB
    # 请求体最大大小
    max-http-post-size: 2MB
    # 是否开启压缩
    compression:
      enabled: true
      # 压缩的MIME类型
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
      # 最小压缩大小
      min-response-size: 1024

# Spring通用配置
spring:
  application:
    name: buff-web
  # 消息转换器配置
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区
    time-zone: GMT+8
    # 序列化配置
    serialization:
      # 格式化输出
      indent-output: false
      # 空对象不序列化
      write-empty-json-arrays: true
      # 失败处理
      fail-on-empty-beans: false
    # 反序列化配置
    deserialization:
      # 失败处理
      fail-on-unknown-properties: false
  # 文件上传配置 - Spring Boot 3.x 使用 spring.servlet.multipart
  servlet:
    multipart:
      # 最大文件大小
      max-file-size: 10MB
      # 最大请求大小
      max-request-size: 50MB
      # 文件大小阈值
      file-size-threshold: 0
      # 是否启用文件上传
      enabled: true
  
  # Jackson消息转换器配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      indent-output: false
      write-empty-json-arrays: true
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  
  # 文件上传配置 - Spring Boot 3.x 使用 spring.servlet.multipart
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 0
      enabled: true
  
  # Redis配置 - Spring Boot 3.x 使用 spring.data.redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    max-connections: 8192
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 20000
    max-http-header-size: 8KB
    max-http-post-size: 2MB
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
      min-response-size: 1024

# 日志格式配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-host: false
    enable-host-text: ""

# 自定义公共配置
buff:
  jwt:
    expiration: 86400000  # 24小时
  api:
    timeout: 30000  # 30秒
    retry-times: 3

