# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/buff_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:buff_dev}
    password: ${DB_PASSWORD:buff_dev}

# 日志配置
logging:
  level:
    com.buff: debug
    org.springframework: info
    com.alibaba.druid: debug
    org.mybatis: debug
  file:
    name: logs/buff-dev.log
    max-size: 10MB
    max-history: 30

# Knife4j配置（开发环境启用）
knife4j:
  enable: true

# 自定义配置
buff:
  # 文件上传路径
  upload-path: ${UPLOAD_PATH:./uploads/}
  # 是否启用调试模式
  debug: true
  # JWT配置
  jwt:
    secret: ${JWT_SECRET:dev_secret_key}