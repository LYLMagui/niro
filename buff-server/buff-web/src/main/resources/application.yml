# 主配置文件 - 通过spring.profiles.active激活对应环境
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 默认激活开发环境
  application:
    name: buff-web
  config:
    import:
      - classpath:config/common/common.yml      # 公共通用配置
      - classpath:config/common/database.yml    # 数据库通用配置
      - optional:classpath:config/dev/application-dev.yml      # 开发环境配置
      - optional:classpath:config/test/application-test.yml    # 测试环境配置  
      - optional:classpath:config/prod/application-prod.yml    # 生产环境配置

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev

---
# 测试环境配置  
spring:
  config:
    activate:
      on-profile: test

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod