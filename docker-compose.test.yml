services:
  niro-db-test:
    image: niro_postgres_test
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: niro-db-test
    restart: always
    environment:
      POSTGRES_DB: niro
      POSTGRES_USER: ${DB_USERNAME:-niro-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-db_niro_pwd}
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - niro_db_data_test:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    shm_size: "1gb" # 生产环境建议提升共享内存
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME:-niro-admin} -d niro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - niro-data-net-test

  niro-redis-test:
    image: redis:8.0-alpine
    container_name: niro-redis-test
    restart: always
    # 使用配置文件启动，并同时通过命令行强制设置密码（双重保障）
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-redis_niro_pwd}"]
    volumes:
      - ./docker/redis/redis-test.conf:/etc/redis/redis.conf
      - niro_redis_data_test:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - niro-data-net-test

  niro-ocr-test:
    image: niro_ocr_test
    build:
      context: ./ocr_demo
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    container_name: niro-ocr-test
    restart: always
    environment:
      OCR_LOG_PATH: /var/log/niro
    ports:
      - "5000:5000"
    volumes:
      - ${NIRO_WORK_DIR:-/home/app}/logs/niro/ocr:/var/log/niro
      - niro_ocr_paddlex_cache_test:/root/.paddlex
      - niro_ocr_paddleocr_cache_test:/root/.paddleocr
      - niro_ocr_paddle_cache_test:/root/.cache/paddle
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - niro-data-net-test

  niro-web-test:
    image: niro_web_test
    build:
      context: ./niro-server
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,niro-db-test,niro-redis-test,niro-ocr-test,niro-web-test,niro-client-test}
    container_name: niro-web-test
    hostname: niro-web-test
    restart: always
    depends_on:
      niro-db-test:
        condition: service_healthy
      niro-redis-test:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_DATASOURCE_URL=jdbc:postgresql://niro-db-test:5432/niro?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-niro-admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-db_niro_pwd}
      - SPRING_DATA_REDIS_HOST=niro-redis-test
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_niro_pwd}
      - NIRO_OCR_BASE_URL=http://niro-ocr-test:5000
      - XXL_JOB_ADMIN_ADDRESS=http://xxl-job-admin:${XXL_JOB_ADMIN_PORT:-8001}/xxl-job-admin
      - XXL_JOB_ACCESS_TOKEN=${XXL_JOB_ACCESS_TOKEN:-niro-xxl-job}
      - XXL_JOB_EXECUTOR_APPNAME=${XXL_JOB_EXECUTOR_APPNAME:-niro-executor}
      - XXL_JOB_EXECUTOR_PORT=${XXL_JOB_EXECUTOR_PORT:-9999}
      - XXL_JOB_EXECUTOR_IP=${XXL_JOB_EXECUTOR_IP:-}
      - XXL_JOB_EXECUTOR_ADDRESS=http://niro-web-test:${XXL_JOB_EXECUTOR_PORT:-9999}
      - ROCKETMQ_NAME_SERVER=rmqnamesrv:9876
      - ROCKETMQ_PRODUCER_GROUP=${ROCKETMQ_PRODUCER_GROUP:-niro-producer-group}
      - ROCKETMQ_CONSUMER_GROUP=${ROCKETMQ_CONSUMER_GROUP:-niro-consumer-group}
      - LOGGING_FILE_PATH=/var/log/niro
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,niro-db-test,niro-redis-test,niro-ocr-test,niro-web-test,niro-client-test},xxl-job-admin,rmqnamesrv,rmqbroker,rmqdashboard
    volumes:
      - ${NIRO_WORK_DIR:-/home/app}/logs/niro/web:/var/log/niro
    ports:
      - "8080:8080" # 生产环境映射到 8081，避免与测试环境 8080 冲突
      - "9999:9999"
    healthcheck:
      # 使用 nc (netcat) 只检查端口是否开启，不关心业务权限
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s # Spring Boot 启动较慢，给 40 秒宽限期
    networks:
      - niro-data-net-test

  niro-client-test:
    image: niro_client_test
    build:
      context: ./niro-client
      dockerfile: Dockerfile
      args:
        ENV_TYPE: ${CLIENT_ENV}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,niro-db-test,niro-redis-test,niro-ocr-test,niro-web-test,niro-client-test}
    container_name: niro-client-test
    restart: always
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,niro-db-test,niro-redis-test,niro-ocr-test,niro-web-test,niro-client-test}
    depends_on:
      niro-web-test:
        condition: service_healthy
    volumes:
      - ${NIRO_WORK_DIR:-/home/app}/logs/niro/client:/var/log/niro
      - ${NIRO_WORK_DIR:-/home/app}/certificate:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - niro-data-net-test

networks:
  niro-data-net-test:
    name: niro-data-net-test
    driver: bridge

volumes:
  niro_db_data_test:
    name: niro_db_data_test
  niro_redis_data_test:
    name: niro_redis_data_test
  niro_ocr_paddlex_cache_test:
    name: niro_ocr_paddlex_cache_test
  niro_ocr_paddleocr_cache_test:
    name: niro_ocr_paddleocr_cache_test
  niro_ocr_paddle_cache_test:
    name: niro_ocr_paddle_cache_test
