server {
    listen 80;
    server_name napcat.nriobox.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name napcat.nriobox.online;

    ssl_certificate /etc/nginx/certs/_.nriobox.online.pem;
    ssl_certificate_key /etc/nginx/certs/_.nriobox.online.key;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 50m;
    access_log /var/log/niro/napcat.access.log;
    error_log /var/log/niro/napcat.error.log warn;

    location = / {
        return 301 /webui/;
    }

    location / {
        proxy_pass http://napcat:6099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

