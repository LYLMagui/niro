server {
    listen 80;
    server_name test.nriobox.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.nriobox.online;

    ssl_certificate /etc/nginx/certs/_.nriobox.online.pem;
    ssl_certificate_key /etc/nginx/certs/_.nriobox.online.key;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20m;
    access_log /var/log/niro/frontend.access.log;
    error_log /var/log/niro/frontend.error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /prod-api/ {
        proxy_pass http://niro-web:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
