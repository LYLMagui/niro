# 所属集群名字，单机版随便起
brokerClusterName = niro
# broker 名字，名字相同的 broker 组成一个组，注意 master 和 slave 名字要一样
brokerName = niro-common
# 0 表示 Master，大于 0 表示 Slave
brokerId = 0
# 删除文件的时间点，默认凌晨 4 点
deleteWhen = 04
# 文件保留时间，默认 48 小时，过期后且达到 deleteWhen 时间点会物理删除
# 如果硬盘小，可以改短一点，比如 24
fileReservedTime = 48
# Broker 的角色：ASYNC_MASTER（异步复制）、SYNC_MASTER（同步双写）、SLAVE
brokerRole = ASYNC_MASTER
# 刷盘方式：ASYNC_FLUSH（异步刷盘，性能好）、SYNC_FLUSH（同步刷盘，数据更安全）
flushDiskType = ASYNC_FLUSH

# 磁盘空间警戒线，默认 88%。达到该比例后将拒绝写入消息，防止硬盘彻底撑爆导致系统崩溃
diskMaxUsedSpaceRatio = 88

# 关键配置：Broker 注册到 NameServer 的 IP
# 在 Docker 环境下，必须手动指定宿主机的 IP，否则 Java 客户端连不上
# 为了支持多环境部署，该值现在由 docker-compose.yml 启动命令从环境变量 ROCKETMQ_IP 动态注入
# brokerIP1 = 127.0.0.1
brokerIP1 = 8.133.242.250

# 是否允许自动创建 Topic
# 生产环境建议关掉，开发环境开启能省去手动建 Topic 的麻烦
autoCreateTopicEnable = true

# 是否允许自动创建订阅组，建议开启
autoCreateSubscriptionGroup = true

# 监听端口
listenPort = 10911

