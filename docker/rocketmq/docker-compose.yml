services:
  # NameServer 是元数据中心，类似服务注册中心
  namesrv:
    image: apache/rocketmq:5.4.0
    container_name: rmqnamesrv
    restart: always
    ports:
      - 9876:9876
    # 挂载日志，方便宿主机直接看日志排查
    volumes:
      - /home/data/rocketmq/logs:/home/rocketmq/logs
    environment:
      # 限制内存占用，防止默认参数太大导致宿主机 OOM
      - JAVA_OPT=-server -Xms128m -Xmx128m -Xmn64m
    networks:
      - rocketmq
      - niro-data-net
    # 限制容器日志大小，防止撑爆硬盘
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    command: sh mqnamesrv

  # Broker 是消息存储核心，负责消息接收和分发
  broker:
    image: apache/rocketmq:5.4.0
    container_name: rmqbroker
    restart: always
    # Docker 内存硬限制（防容器爆内存）
    mem_limit: 768m
    ports:
      - 10909:10909
      - 10911:10911
    volumes:
      - /home/data/rocketmq/logs/broker:/home/rocketmq/rocketmq-5.4.0/logs
      - /home/data/rocketmq/store/broker:/home/rocketmq/rocketmq-5.4.0/store
      - ./conf/broker.conf:/home/rocketmq/rocketmq-5.4.0/conf/broker.conf
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    # 核心修复：启动前修改脚本里的默认 2G 内存参数，再启动 broker
    entrypoint: >
      sh -c '
      echo "修改 RocketMQ 默认内存配置..." &&
      sed -i "s|-Xms[0-9]*[gm]|-Xms256m|g; s|-Xmx[0-9]*[gm]|-Xmx256m|g; s|-Xmn[0-9]*[gm]|-Xmn128m|g; s|-XX:MaxDirectMemorySize=[0-9]*[gm]|-XX:MaxDirectMemorySize=128m|g" /home/rocketmq/rocketmq-5.4.0/bin/runbroker.sh &&
      cat /home/rocketmq/rocketmq-5.4.0/bin/runbroker.sh | grep JAVA_OPT | head -3 &&
      echo "启动 Broker..." &&
      cd /home/rocketmq/rocketmq-5.4.0 &&
      sh bin/mqbroker -c conf/broker.conf
      '
    depends_on:
      - namesrv
    networks:
      - rocketmq
      - niro-data-net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  # Proxy 是 5.x 引入的代理模式，支持 gRPC 协议，多语言接入更友好
  # proxy:
  #   image: apache/rocketmq:5.4.0
  #   container_name: rmqproxy
  #   env_file:
  #     - .env
  #   ports:
  #     - 28080:8080
  #     - 28081:8081  
  #   volumes:
  #     - ./logs/proxy:/home/rocketmq/logs
  #   environment:
  #     - NAMESRV_ADDR=rmqnamesrv:9876
  #     - JAVA_OPT=-server -Xms256m -Xmx256m -Xmn128m
  #   depends_on:
  #     - broker
  #   networks:
  #     - rocketmq
  #   # 限制容器日志大小，防止撑爆硬盘
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "100m"
  #       max-file: "3"
  #   command: sh mqproxy

  # Dashboard 提供图形化管理界面，方便查看主题、消费者和消息详情
  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqdashboard
    restart: always
    ports:
      - 18080:8082
    environment:
      # 指定 NameServer 地址
      - NAMESRV_ADDR=rmqnamesrv:9876
      # 限制内存占用
      - JAVA_OPTS=-Xms128m -Xmx128m
      # 设置默认语言为中文
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
    depends_on:
      - namesrv
    networks:
      - rocketmq
      - niro-data-net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  rocketmq:
    driver: bridge
  niro-data-net:
    external: true


