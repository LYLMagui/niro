services:
  # NameServer 是元数据中心，类似服务注册中心
  namesrv:
    image: apache/rocketmq:5.4.0
    container_name: rmqnamesrv
    ports:
      - 9876:9876
    # 挂载日志，方便宿主机直接看日志排查
    volumes:
      - /home/data/rocketmq/logs:/home/rocketmq/logs
    environment:
      # 限制内存占用，防止默认参数太大导致宿主机 OOM
      - JAVA_OPT=-server -Xms256m -Xmx256m -Xmn128m
    networks:
      - rocketmq
    # 限制容器日志大小，防止撑爆硬盘
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    command: sh mqnamesrv

  # Broker 是消息存储核心，负责消息接收和分发
  broker:
    image: apache/rocketmq:5.4.0
    container_name: rmqbroker
    ports:
      - 10909:10909
      - 10911:10911
    # 挂载 store 目录确保消息持久化，不挂载重启消息就丢了
    volumes:
      - /home/data/rocketmq/logs/broker:/home/rocketmq/rocketmq-5.4.0/logs
      - /home/data/rocketmq/store/broker:/home/rocketmq/rocketmq-5.4.0/store
      - ./conf/broker.conf:/home/rocketmq/rocketmq-5.4.0/conf/broker.conf
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      # Broker 比较吃内存，开发环境给到 512M
      - JAVA_OPT=-server -Xms512m -Xmx1024m -Xmn512m
    depends_on:
      - namesrv
    networks:
      - rocketmq
    # 限制容器日志大小，防止撑爆硬盘
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    # 启动时通过 -p 参数动态注入环境变量中配置的 IP，解决跨环境部署问题
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.4.0/conf/broker.conf
    # command: sh mqbroker -c /home/rocketmq/conf/broker.conf

  # Proxy 是 5.x 引入的代理模式，支持 gRPC 协议，多语言接入更友好
  # proxy:
  #   image: apache/rocketmq:5.4.0
  #   container_name: rmqproxy
  #   env_file:
  #     - .env
  #   ports:
  #     - 28080:8080
  #     - 28081:8081  
  #   volumes:
  #     - ./logs/proxy:/home/rocketmq/logs
  #   environment:
  #     - NAMESRV_ADDR=rmqnamesrv:9876
  #     - JAVA_OPT=-server -Xms256m -Xmx256m -Xmn128m
  #   depends_on:
  #     - broker
  #   networks:
  #     - rocketmq
  #   # 限制容器日志大小，防止撑爆硬盘
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "100m"
  #       max-file: "3"
  #   command: sh mqproxy

  # Dashboard 提供图形化管理界面，方便查看主题、消费者和消息详情
  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqdashboard
    ports:
      - 18080:8082
    environment:
      # 指定 NameServer 地址
      - NAMESRV_ADDR=rmqnamesrv:9876
      # 限制内存占用
      - JAVA_OPTS=-Xms256m -Xmx256m
      # 设置默认语言为中文
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
    depends_on:
      - namesrv
    networks:
      - rocketmq
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  rocketmq:
    driver: bridge