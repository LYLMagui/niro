version: '3.8'

services:
  acemcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: acemcp-node:latest
    container_name: acemcp-server
    ports:
      - "8080:8080"
    volumes:
      # 持久化配置和数据
      - acemcp-config:/root/.acemcp
      # 挂载要索引的项目目录（根据需要修改路径）
      - ${PROJECT_PATH:-../..}:/workspace
    environment:
      - NODE_ENV=production
      # API 配置（需要根据实际情况修改）
      - BASE_URL=${BASE_URL:-https://api.example.com}
      - TOKEN=${TOKEN:-your-token-here}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - niro-network
    command: >
      sh -c "acemcp-node
      --project-path /workspace
      --base-url $${BASE_URL}
      --token $${TOKEN}
      --web-port 8080
      --host 0.0.0.0"

networks:
  niro-network:
    external: true

volumes:
  acemcp-config:
    name: acemcp-config
