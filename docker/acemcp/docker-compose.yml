version: '3.8'

services:
  acemcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: acemcp-node:latest
    container_name: acemcp-server
    ports:
      - "8080:8080"
    volumes:
      # 持久化配置和数据
      - ./data:/root/.acemcp
      # 挂载 settings.toml 配置文件（可编辑）
      - ./config/settings.toml:/root/.acemcp/settings.toml:ro
      # 挂载要索引的项目目录（根据需要修改路径）
      - ${PROJECT_PATH:-../..}:/workspace:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - niro-network
    command: >
      sh -c "acemcp-node
      --project-path /workspace
      --web-port 8080
      --host 0.0.0.0"

networks:
  niro-network:
    external: true
