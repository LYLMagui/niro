# Ace-Mcp-Node 配置文件
# 路径: /root/.acemcp/settings.toml

# ===================
# API 配置（必填）
# ===================

# 索引服务器地址
# 需要部署 Ace-Mcp-Server 后端服务，或使用公共服务
BASE_URL = "https://api.exampleaaa.com"

# 访问令牌
TOKEN = "your-token-here"

# ===================
# 索引配置
# ===================

# 批量上传数量 (1-50)
BATCH_SIZE = 10

# 单个代码块最大行数
MAX_LINES_PER_BLOB = 800

# ===================
# 文件类型配置
# ===================

# 支持索引的文本文件扩展名
TEXT_EXTENSIONS = [
  # 编程语言
  ".py", ".js", ".ts", ".jsx", ".tsx",
  ".java", ".go", ".rs", ".cpp", ".c",
  ".h", ".hpp", ".cs", ".rb", ".php",
  ".swift", ".kt", ".scala", ".clj",

  # 配置和数据
  ".md", ".txt", ".json", ".yaml", ".yml",
  ".toml", ".xml", ".ini", ".conf",

  # Web 相关
  ".html", ".css", ".scss", ".sass", ".less",

  # 脚本
  ".sql", ".sh", ".bash", ".ps1", ".bat"
]

# ===================
# 排除模式
# ===================

# 不会被索引的目录和文件模式
EXCLUDE_PATTERNS = [
  # 虚拟环境
  ".venv", "venv", ".env", "env",
  "node_modules",

  # 版本控制
  ".git", ".svn", ".hg",

  # Python 缓存
  "__pycache__", ".pytest_cache", ".mypy_cache",
  ".tox", ".eggs", "*.egg-info",

  # 构建产物
  "dist", "build", "target", "out",

  # IDE 配置
  ".idea", ".vscode", ".vs",

  # 系统文件
  ".DS_Store", "Thumbs.db",

  # 编译文件
  "*.pyc", "*.pyo", "*.pyd", "*.so", "*.dll"
]

# ===================
# 日志配置
# ===================

# 日志级别: trace, debug, info, warn, error
LOG_LEVEL = "info"

# 是否启用日志文件
LOG_TO_FILE = true

# 日志文件最大大小 (MB)
LOG_MAX_SIZE = 10

# 日志文件保留天数
LOG_MAX_DAYS = 7
