services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    networks:
      - default
      - niro-data-net
    command: --log-dir /app/logs
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${NEW_API_DB_USER}:${NEW_API_DB_PASSWORD}@postgres:5432/${NEW_API_DB_NAME} # 从 .env 读取 PostgreSQL 连接信息
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录
      - BATCH_UPDATE_ENABLED=true # 是否启用批量更新
    depends_on:
      - redis
      - postgres
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - default
      - niro-data-net

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
      - -c
      - temp_buffers=${POSTGRES_TEMP_BUFFERS:-4MB}
    environment:
      POSTGRES_USER: ${NEW_API_DB_USER}
      POSTGRES_PASSWORD: ${NEW_API_DB_PASSWORD}
      POSTGRES_DB: ${NEW_API_DB_NAME}
    volumes:
      - /home/data/new-api/data:/var/lib/postgresql/data
    networks:
      - default
      - niro-data-net

networks:
  niro-data-net:
    external: true
