# Redis 生产环境配置文件

# 基础安全
# 注意：密码会通过 docker-compose 中的 command 参数动态覆盖，或者你也可以直接在这里写死
# requirepass ${REDIS_PASSWORD}

# 监听地址
bind 0.0.0.0

# 性能优化
maxmemory 512mb
maxmemory-policy allkeys-lru

# 持久化策略（生产环境建议开启 AOF）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 关闭保护模式（因为我们在 Docker 网络内部，并且有密码保护）
protected-mode no

# 数据库数量
databases 16
