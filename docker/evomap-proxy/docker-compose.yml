version: '3.8'

services:
  evomap-proxy:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: evomap-proxy
    ports:
      - "8000:8000"
    environment:
      - EVOMAP_HUB_URL=${EVOMAP_HUB_URL:-https://evomap.ai}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - evomap-network

networks:
  evomap-network:
    driver: bridge
