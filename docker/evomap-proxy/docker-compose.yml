version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: evomap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - evomap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  evomap-proxy:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: evomap-proxy
    ports:
      - "8000:8000"
    environment:
      - EVOMAP_HUB_URL=${EVOMAP_HUB_URL:-https://evomap.ai}
      - CACHE_TTL=${CACHE_TTL:-300}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - evomap-network

volumes:
  redis-data:

networks:
  evomap-network:
    driver: bridge
