# docker-compose version
services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: xxl-job-mysql
    restart: always
    env_file:
      - .env
    environment:
      # 时区设置
      TZ: ${TZ:-Asia/Shanghai}
      # 1、数据库密码设置，需要与Admin中配置一致：
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 2、数据库实例名称，需要与Admin中配置一致；
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xxl_job}
    ports:
      - "${MYSQL_PORT_EXTERNAL:-3306}:3306"
    volumes:
      # 说明：仅数据库首次初始化时执行；
      - ../postgres/reference/xxl-job-tables-mysql.sql:/docker-entrypoint-initdb.d/tables_xxl_job.sql:ro
      # 3、数据库持久化目录位置，建议自定义：
      - ${MYSQL_PATH:-./mysql}/conf:/etc/mysql/conf.d
      - ${MYSQL_PATH:-./mysql}/logs:/var/log/mysql
      - ${MYSQL_PATH:-./mysql}/data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-job-network

  xxl-job-admin:
    # 4、调度中心本地Build设置，如果期望使用推动DockerHub的镜像，可以注释当前启用的image、build配置，并启用如下设置版本的image配置；
    #image: xuxueli/xxl-job-admin:{version}
    image: xuxueli/xxl-job-admin:${XXL_JOB_ADMIN_VERSION:-3.3.2}
    container_name: xxl-job-admin
    restart: always
    env_file:
      - .env
    environment:
      # 时区设置
      TZ: ${TZ:-Asia/Shanghai}
      # 5、数据库密码设置，需要与上文Mysql中保持一致：
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xxl_job}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-default_token}
        --server.port=${XXL_JOB_ADMIN_PORT:-8080}
        --server.servlet.context-path=${XXL_JOB_ADMIN_CONTEXT_PATH:-/xxl-job-admin}
    ports:
      - "${XXL_JOB_ADMIN_PORT:-8080}:${XXL_JOB_ADMIN_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - xxl-job-network
  

networks:
  xxl-job-network:
    driver: bridge
