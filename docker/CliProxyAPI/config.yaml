# 监听地址。空字符串表示监听所有网卡。
host: ""

# 主服务端口。API 与管理面板共用这个端口。
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # 使用管理面板时，需要允许远程访问管理接口。
  # 更稳妥的做法是把 8317 放到反向代理后面，并限制来源 IP。
  allow-remote: true

  # 所有管理请求都需要这个密钥。
  # 不要使用默认值，上线前务必改成强随机字符串。
  secret-key: "please-change-this-secret"

  # 保持 false，服务会自动提供 /management.html。
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# OAuth 授权文件存储目录，对应 compose 中挂载的 auths 目录。
auth-dir: "~/.cli-proxy-api"

# API 访问鉴权 key。
api-keys:
  - "please-change-this-api-key"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

commercial-mode: false
logging-to-file: true
logs-max-total-size-mb: 512
error-logs-max-files: 10
usage-statistics-enabled: false

# 如果服务器需要走代理访问上游，再填这里。
proxy-url: ""

force-model-prefix: false
passthrough-headers: false
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30

quota-exceeded:
  switch-project: true
  switch-preview-model: true

routing:
  strategy: "round-robin"

ws-auth: false
nonstream-keepalive-interval: 0

