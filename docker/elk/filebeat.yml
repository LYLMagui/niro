filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/niro/spider/*.json
  tags: ["spider"]
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - /var/log/niro/java/*.json
  tags: ["backend"]
  json.keys_under_root: true
  json.add_error_key: true

processors:
  # 1. 核心修复：将 Loguru 的真实时间 repr (字符串) 转换为 ES 的 @timestamp
  - timestamp:
      if: contains(tags, "spider")
      field: record.time.repr
      layouts:
        - '2006-01-02 15:04:05.999999-07:00'
        - '2006-01-02 15:04:05.999999'
      timezone: 'Asia/Shanghai'

  # 2. 将 Java 日志的 timestamp 转换为 @timestamp
  - timestamp:
      if: contains(tags, "backend")
      field: timestamp
      layouts:
        - '2006-01-02T15:04:05.999Z'
        - '2006-01-02 15:04:05.999'
      timezone: 'Asia/Shanghai'

  # 3. 清理多余字段，节省磁盘空间
  - drop_fields:
      fields: ["log", "input", "agent", "ecs", "host"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  indices:
    - index: "niro-spider-%{+yyyy.MM.dd}"
      when.contains:
        tags: "spider"
    - index: "niro-backend-%{+yyyy.MM.dd}"
      when.contains:
        tags: "backend"

setup.ilm.enabled: false
setup.template.enabled: false

queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

logging.level: info
logging.to_files: false
logging.to_stderr: true