filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/niro/*.json
  # 不在 Input 层直接解开 keys_under_root，交给下面的 processor 统一处理

processors:
  # 1. 解析 JSON 内容
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

  # 2. 核心修复：将 Loguru 的真实时间 repr (字符串) 转换为 ES 的 @timestamp
  - timestamp:
      field: record.time.repr
      layouts:
        - '2006-01-02 15:04:05.999999' # 匹配 6 位微秒
        - '2006-01-02 15:04:05.999'    # 匹配 3 位毫秒
        - '2006-01-02 15:04:05'        # 匹配整数秒
      timezone: 'Asia/Shanghai'      # 显式指定日志的时区
      ignore_failure: false          # 如果解析失败，在日志中报错以便调试

  # 3. 清理多余字段，节省 2G 内存服务器的磁盘空间
  - drop_fields:
      fields: ["message", "log", "input", "agent", "ecs"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "niro-spider-%{+yyyy.MM.dd}"

setup.template.name: "niro-spider"
setup.template.pattern: "niro-spider-*"
setup.ilm.enabled: false

queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

logging.level: info
logging.to_files: false
logging.to_stderr: true
