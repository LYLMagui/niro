name: Manual Build and Push Niro Images

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: '选择构建环境 (prod 使用 latest，test 使用 test-latest)'
        required: true
        type: choice
        default: prod
        options:
          - prod
          - test
      image_tag:
        description: '自定义镜像标签 (如 v1.0.1)。留空则自动生成: 环境-SHA'
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build variables
        shell: bash
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          if [ "${{ github.event.inputs.target_env }}" = "prod" ]; then
            ENV_TYPE=prod
            ENV_LATEST=latest
            ENV_PREFIX=prod
          else
            ENV_TYPE=test
            ENV_LATEST=test-latest
            ENV_PREFIX=test
          fi

          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            FINAL_TAG=${{ github.event.inputs.image_tag }}
          else
            FINAL_TAG=${ENV_PREFIX}-${SHORT_SHA}
          fi

          echo "ENV_TYPE=${ENV_TYPE}" >> "$GITHUB_ENV"
          echo "ENV_LATEST=${ENV_LATEST}" >> "$GITHUB_ENV"
          echo "FINAL_TAG=${FINAL_TAG}" >> "$GITHUB_ENV"

      - name: Build niro-postgres image
        shell: bash
        run: |
          docker build \
            -t niro_postgres_local \
            -f docker/postgres/Dockerfile \
            docker/postgres

      - name: Build niro-ocr image
        shell: bash
        run: |
          docker build \
            -t niro_ocr_local \
            -f ocr_demo/Dockerfile \
            ocr_demo

      - name: Build niro-web image
        shell: bash
        run: |
          docker build \
            -t niro_web_local \
            -f niro-server/Dockerfile \
            niro-server

      - name: Build niro-client image
        shell: bash
        run: |
          docker build \
            --build-arg ENV_TYPE=${ENV_TYPE} \
            -t niro_client_local \
            -f niro-client/Dockerfile \
            niro-client

      - name: Tag and push niro-postgres
        shell: bash
        run: |
          docker tag niro_postgres_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-postgres:${ENV_LATEST}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-postgres:${ENV_LATEST}
          docker tag niro_postgres_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-postgres:${FINAL_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-postgres:${FINAL_TAG}

      - name: Tag and push niro-ocr
        shell: bash
        run: |
          docker tag niro_ocr_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-ocr:${ENV_LATEST}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-ocr:${ENV_LATEST}
          docker tag niro_ocr_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-ocr:${FINAL_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-ocr:${FINAL_TAG}

      - name: Tag and push niro-web
        shell: bash
        run: |
          docker tag niro_web_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-web:${ENV_LATEST}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-web:${ENV_LATEST}
          docker tag niro_web_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-web:${FINAL_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-web:${FINAL_TAG}

      - name: Tag and push niro-client
        shell: bash
        run: |
          docker tag niro_client_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-client:${ENV_LATEST}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-client:${ENV_LATEST}
          docker tag niro_client_local ${{ secrets.DOCKERHUB_USERNAME }}/niro-client:${FINAL_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/niro-client:${FINAL_TAG}

      - name: Logout from Docker Hub
        run: docker logout
