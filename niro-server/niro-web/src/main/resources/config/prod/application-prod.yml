spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:niro}?currentSchema=${DB_SCHEMA:public}&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&
    username: ${DB_USERNAME:buff_test}
    password: ${DB_PASSWORD:buff_test}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 30000ms
      connect-timeout: 30000ms
      redisson:
        ping-connection-interval: 30000

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

logging:
  level:
    com.buff: info
    org.springframework: warn
    com.alibaba.druid: info
    org.mybatis: info

knife4j:
  enable: false
  setting:
    language: zh_CN

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

buff:
  upload-path: ${UPLOAD_PATH:/data/buff/uploads/}
  debug: false
  jwt:
    secret: ${JWT_SECRET:prod_secret_key}

niro:
  security:
    allowed-origins:
      - https://nriobox.online
