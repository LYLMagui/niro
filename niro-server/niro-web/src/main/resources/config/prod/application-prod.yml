# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://prod-db-cluster:5432/buff_prod?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&stringtype=unspecified
    username: ${DB_USERNAME:buff_prod}
    password: ${DB_PASSWORD:ENC(prod_password_encrypted)}

  # Redis配置 - 已切换为 Redisson
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 30000ms
      connect-timeout: 30000ms
      # Redisson 特有配置
      redisson:
        # 每 30 秒进行一次连接可用性探测 (PING)
        ping-connection-interval: 30000
      # 移除 Lettuce 相关配置，Redisson 会自动接管连接池


# 日志配置
logging:
  level:
    com.buff: warn
    org.springframework: error
    com.alibaba.druid: warn
    org.mybatis: warn

# Knife4j配置（生产环境关闭）
knife4j:
  enable: false

# 自定义配置
buff:
  # 文件上传路径
  upload-path: ${UPLOAD_PATH:/opt/data/buff/uploads/}
  # 是否启用调试模式
  debug: false
  # JWT配置
  jwt:
    secret: ${JWT_SECRET:ENC(jwt_secret_encrypted)}
    # 生产环境缩短过期时间为1小时
    expiration: 3600000