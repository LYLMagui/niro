
# 爬虫相关配置
spider:
  log:
    # 爬虫日志路径，优先使用环境变量 SPIDER_LOG_PATH
    # 默认指向 ../niro-spider/logs/niro_spider.log
    path: ${SPIDER_LOG_PATH:../niro-spider/logs/niro_spider.log}

# Spring 全局配置
spring:
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

c5:
  base-url: https://openapi.c5game.com

# XXL-JOB 任务调度配置
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESS:http://localhost:8080/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:niro-xxl-job}
    executor:
      appname: niro-executor
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30