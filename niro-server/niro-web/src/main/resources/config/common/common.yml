# 服务器通用配置
server:
  # 端口
  port: 8080
  # 应用上下文路径
  servlet:
    context-path: /
  # 编码配置
  tomcat:
    # URI编码
    uri-encoding: UTF-8
    # 最大连接数
    max-connections: 8192
    # 最大线程数
    max-threads: 200
    # 最小空闲线程数
    min-spare-threads: 10
    # 连接超时时间（毫秒）
    connection-timeout: 20000
    # 请求头最大大小
    max-http-header-size: 8KB
    # 请求体最大大小
    # 是否开启压缩
    compression:
      enabled: true
      # 压缩的MIME类型
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
      # 最小压缩大小
      min-response-size: 1024
    max-http-form-post-size: 2MB

# Spring通用配置
spring:
  application:
    name: buff-web
  # 消息转换器配置
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区
    time-zone: GMT+8
    # 序列化配置
    serialization:
      # 格式化输出
      indent-output: false
      # 空对象不序列化
      write-empty-json-arrays: true
      # 失败处理
      fail-on-empty-beans: false
    # 反序列化配置
    deserialization:
      # 失败处理
      fail-on-unknown-properties: false
  # 文件上传配置 - Spring Boot 3.x 使用 spring.servlet.multipart
  servlet:
    multipart:
      # 最大文件大小
      max-file-size: 10MB
      # 最大请求大小
      max-request-size: 50MB
      # 文件大小阈值
      file-size-threshold: 0
      # 是否启用文件上传
      enabled: true

# 日志格式配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


# 自定义公共配置
jwt:
  expiration: 86400000  # 24小时
api:
  timeout: 30000  # 30秒
  retry-times: 3

# sa-token 配置
sa-token:
  # token风格
  token-style: random-64
  # token名称 (修改为 niro-web-token 以区分模块)
  token-name: niro-web-token
  # token 过期时间（秒）
  timeout: 86400000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 是否输出操作日志 
  is-log: true
  # token 前缀
  token-prefix: Bearer
  # 关闭从 Cookie 读取 Token，强制从 Header 读取，避免 Cookie 中无前缀的 Token 导致"未按照指定前缀提交 token"错误
  is-read-cookie: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.niro.web.entity
  configuration:
    map-underscore-to-camel-case: true
