# 数据库通用配置
spring:
  datasource:
    # 数据库驱动类名
    driver-class-name: org.postgresql.Driver
    # 连接池类型
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid连接池配置
    druid:
      # 初始化连接数
      initial-size: 5
      # 最小连接数
      min-idle: 5
      # 最大连接数
      max-active: 20
      # 获取连接等待超时时间（毫秒）
      max-wait: 60000
      # 间隔多久检测一次需要关闭的空连接（毫秒）
      time-between-eviction-runs-millis: 60000
      # 连接保持空闲而不被驱逐的最小时间（毫秒）
      min-evictable-idle-time-millis: 300000
      # 检测连接是否有效的SQL (PostgreSQL使用SELECT 1)
      validation-query: SELECT 1
      # 检测连接是否有效，如果为true，则必须validation-query不为空
      test-while-idle: true
      # 申请连接时执行validationQuery检测连接是否有效
      test-on-borrow: false
      # 归还连接时执行validationQuery检测连接是否有效
      test-on-return: false
      # PostgreSQL不支持pool-prepared-statements优化，建议关闭
      pool-prepared-statements: false
      # 指定每个连接上PSCache的最大值
      max-pool-prepared-statement-per-connection-size: 20
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
      # 连接属性配置
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # 监控统计拦截的filters
      filters: stat,wall,slf4j
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      stat:
        merge-sql: true
        slow-sql-millis: 5000
        log-slow-sql: true

  # Flyway 数据库版本管理
  flyway:
    enabled: true
    # 迁移脚本位置：classpath:db/migration
    locations: classpath:db/migration
    # 非空 schema 且无 flyway 历史表时，自动建立 baseline（首次接入保护）
    baseline-on-migrate: true
    # baseline 版本（低于所有真实 migration，确保历史脚本会被回放）
    baseline-version: 1
    baseline-description: "Initial baseline"
    # 启动时校验脚本 checksum，历史脚本被改过则启动失败
    validate-on-migrate: true
    # 禁止乱序执行（强制按版本号递增）
    out-of-order: false
    # 禁用 clean 命令，防止误清库
    clean-disabled: true
    # 统一历史表名
    table: flyway_schema_history
    # 默认使用 druid 同一数据源（Spring Boot 自动装配）

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    # 下划线转驼峰命名
    map-underscore-to-camel-case: true
    # 使用 Slf4jImpl 以支持日志分级控制 (DEBUG: SQL, TRACE: Results)
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: is_deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
      # 主键生成策略
      id-type: ASSIGN_ID
  # 扫描的Mapper接口路径
  mapper-locations: classpath*:mapper/**/*.xml