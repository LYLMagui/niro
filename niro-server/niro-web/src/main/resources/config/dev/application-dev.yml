  # 开发环境配置
  spring:
    config:
      activate:
        on-profile: dev
    
    # 数据库配置
    datasource:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:niro}?currentSchema=${DB_SCHEMA:public}&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      username: ${DB_USERNAME:buff_dev}
      password: ${DB_PASSWORD:buff_dev}
  
    # Redis配置
    data:
      redis:
        host: ${REDIS_HOST:106.53.11.158}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:Lyl010430.}
        timeout: 30000ms
        connect-timeout: 30000ms
        # Redisson 特有配置
        redisson:
          # 每 30 秒进行一次连接可用性探测 (PING)
          ping-connection-interval: 30000
  
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://106.53.11.158:9200}

  
  # 日志配置
  logging:
    level:
      com.buff: debug
      org.springframework: info
      com.alibaba.druid: debug
      org.mybatis: debug
    file:
      name: logs/buff-dev.log
    logback:
      rolling policy:
        max-file-size: 10MB
        max-history: 30
  
  # Knife4j配置（开发环境启用）
  knife4j:
    enable: false
    setting:
      language: zh_cn
      enable-swagger-models: false
      enable-document-manage: true
      enable-host: false
      enable-host-text: ""
  # 自定义配置
  buff:
    # 文件上传路径
    upload-path: ${UPLOAD_PATH:./uploads/}
    # 是否启用调试模式
    debug: true
    # JWT配置
    jwt:
      secret: ${JWT_SECRET:dev_secret_key}