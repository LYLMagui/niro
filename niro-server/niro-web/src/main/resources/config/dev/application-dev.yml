# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:niro}?currentSchema=${DB_SCHEMA:public}&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:buff_dev}
    password: ${DB_PASSWORD:buff_dev}

  # Redis配置 - Spring Boot 3.x 使用 spring.data.redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 30000ms
      connect-timeout: 30000ms
      lettuce:
        shutdown-timeout: 2000ms
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 10000ms
          time-between-eviction-runs: 30s


# 日志配置
logging:
  level:
    com.buff: debug
    org.springframework: info
    com.alibaba.druid: debug
    org.mybatis: debug
  file:
    name: logs/buff-dev.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 30

# Knife4j配置（开发环境启用）
knife4j:
  enable: false
  setting:
    language: zh_cn
    enable-swagger-models: false
    enable-document-manage: true
    enable-host: false
    enable-host-text: ""
# 自定义配置
buff:
  # 文件上传路径
  upload-path: ${UPLOAD_PATH:./uploads/}
  # 是否启用调试模式
  debug: true
  # JWT配置
  jwt:
    secret: ${JWT_SECRET:dev_secret_key}