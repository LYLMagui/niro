# 主配置文件 - 通过spring.profiles.active激活对应环境
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:@spring.profiles.active@}  # 使用 Maven 属性作为默认值
  application:
    name: buff-web
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  config:
    import:
      - optional:file:/.env[.properties]            # 优先加载根目录 .env 文件
      - optional:file:./.env[.properties]           # 加载当前工作目录 .env 文件
      - optional:file:../.env[.properties]          # 兼容旧相对路径 .env 文件
      - classpath:config/common/common.yml          # 公共通用配置
      - classpath:config/common/database.yml        # 数据库通用配置
      - optional:classpath:config/test/application-test.yml    # 测试环境配置
      - optional:classpath:config/prod/application-prod.yml    # 生产环境配置

niro:
  ocr:
    base-url: ${NIRO_OCR_BASE_URL:http://127.0.0.1:5000}
    connect-timeout-ms: ${NIRO_OCR_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${NIRO_OCR_READ_TIMEOUT_MS:30000}

---
# 测试环境配置
spring:
  config:
    activate:
      on-profile: test
