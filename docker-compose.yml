services:
  niro-db:
    image: wkelai/niro-postgres:latest
    container_name: niro-db
    restart: always
    environment:
      POSTGRES_DB: niro
      POSTGRES_USER: ${DB_USERNAME:-niro-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-db_niro_pwd}
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - niro_db_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-niro-admin} -d niro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - niro-data-net

  niro-redis:
    image: redis:8.0-alpine
    container_name: niro-redis
    restart: always
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-redis_niro_pwd}"]
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf
      - niro_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - niro-data-net

  niro-ocr:
    image: wkelai/niro-ocr:latest
    container_name: niro-ocr
    restart: always
    environment:
      OCR_LOG_PATH: /var/log/niro
    ports:
      - "5000:5000"
    volumes:
      - ${NIRO_WORK_DIR:-/home/app}/logs/niro/ocr:/var/log/niro
      - niro_ocr_paddlex_cache:/root/.paddlex
      - niro_ocr_paddleocr_cache:/root/.paddleocr
      - niro_ocr_paddle_cache:/root/.cache/paddle
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - niro-data-net

  niro-web:
    image: wkelai/niro-web:latest
    container_name: niro-web
    restart: always
    depends_on:
      niro-db:
        condition: service_healthy
      niro-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:postgresql://niro-db:5432/niro?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-niro-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-db_niro_pwd}
      SPRING_DATA_REDIS_HOST: niro-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_niro_pwd}
      NIRO_OCR_BASE_URL: http://niro-ocr:5000
      XXL_JOB_ADMIN_ADDRESS: ${XXL_JOB_ADMIN_ADDRESS:-http://xxl-job-admin:8001/xxl-job-admin}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-niro-xxl-job}
      XXL_JOB_EXECUTOR_APPNAME: ${XXL_JOB_EXECUTOR_APPNAME:-niro-executor}
      XXL_JOB_EXECUTOR_PORT: ${XXL_JOB_EXECUTOR_PORT:-9999}
      XXL_JOB_EXECUTOR_IP: ${XXL_JOB_EXECUTOR_IP:-}
      XXL_JOB_EXECUTOR_ADDRESS: ${XXL_JOB_EXECUTOR_ADDRESS:-http://niro-web:9999}
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-rmqnamesrv:9876}
      ROCKETMQ_PRODUCER_GROUP: ${ROCKETMQ_PRODUCER_GROUP:-niro-producer-group}
      ROCKETMQ_CONSUMER_GROUP: ${ROCKETMQ_CONSUMER_GROUP:-niro-consumer-group}
      ROCKETMQ_NAMESPACE: ${ROCKETMQ_NAMESPACE:-niro-prod}
      JWT_SECRET: ${JWT_SECRET:-prod_secret_key}
      NIRO_SECURITY_APP_KEY_AES_KEY: ${NIRO_SECURITY_APP_KEY_AES_KEY}
      NIRO_SECURITY_APP_KEY_RSA_PUBLIC_KEY: ${NIRO_SECURITY_APP_KEY_RSA_PUBLIC_KEY}
      NIRO_SECURITY_APP_KEY_RSA_PRIVATE_KEY: ${NIRO_SECURITY_APP_KEY_RSA_PRIVATE_KEY}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,niro-db,niro-redis,niro-ocr,niro-web,niro-client},xxl-job-admin,rmqnamesrv,rmqbroker,rmqdashboard
    volumes:
      - ${NIRO_WORK_DIR:-/home/app}/logs/niro/web:/var/log/niro
    ports:
      - "8080:8080"
      - "9999:9999"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - niro-data-net

  niro-client:
    image: wkelai/niro-client:latest
    container_name: niro-client
    restart: always
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,niro-db,niro-redis,niro-ocr,niro-web,niro-client},xxl-job-admin,rmqnamesrv,rmqbroker,rmqdashboard
    depends_on:
      niro-web:
        condition: service_healthy
    volumes:
      - ${NIRO_WORK_DIR:-/home/app}/logs/niro/client:/var/log/niro
      - ./niro-client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NIRO_WORK_DIR:-/home/app}/certificate:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - niro-data-net

networks:
  niro-data-net:
    name: niro-data-net
    driver: bridge

volumes:
  niro_db_data:
    name: niro_db_data
  niro_redis_data:
    name: niro_redis_data
  niro_ocr_paddlex_cache:
    name: niro_ocr_paddlex_cache
  niro_ocr_paddleocr_cache:
    name: niro_ocr_paddleocr_cache
  niro_ocr_paddle_cache:
    name: niro_ocr_paddle_cache
