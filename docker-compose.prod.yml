services:
  niro-db-prod:
    image: postgres:18-alpine
    user: "70:70"
    container_name: niro-db-prod
    restart: always
    environment:
      POSTGRES_DB: niro
      POSTGRES_USER: ${DB_USERNAME:-niro-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-db_niro_pwd}
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - niro_db_data_prod:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    shm_size: "1gb" # 生产环境建议提升共享内存
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-niro-admin} -d niro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - niro-data-net-prod

  niro-redis-prod:
    image: redis:8.0-alpine
    container_name: niro-redis-prod
    restart: always
    # 使用配置文件启动，并同时通过命令行强制设置密码（双重保障）
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-redis_niro_pwd}"]
    volumes:
      - ./docker/redis/redis-prod.conf:/etc/redis/redis.conf
      - niro_redis_data_prod:/data
    ports:
      - "6790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - niro-data-net-prod

  niro-web-prod:
    build:
      context: ./niro-server
      dockerfile: Dockerfile
    container_name: niro-web-prod
    restart: always
    depends_on:
      niro-db-prod:
        condition: service_healthy
      niro-redis-prod:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://niro-db-prod:5432/niro?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-niro-admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-db_niro_pwd}
      - SPRING_DATA_REDIS_HOST=niro-redis-prod
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_niro_pwd}
      - SPIDER_LOG_PATH=/app/logs/spider/niro_spider.log
    volumes:
      - niro_shared_logs_prod:/app/logs/spider
    ports:
      - "8081:8080" # 生产环境映射到 8081，避免与测试环境 8080 冲突
    healthcheck:
      # 使用 nc (netcat) 只检查端口是否开启，不关心业务权限
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s # Spring Boot 启动较慢，给 40 秒宽限期
    networks:
      - niro-data-net-prod

  niro-spider-prod:
    build:
      context: ./niro-spider
      dockerfile: Dockerfile
    container_name: niro-spider-prod
    restart: always
    depends_on:
      niro-db-prod:
        condition: service_healthy
      niro-redis-prod:
        condition: service_healthy
      niro-web-prod:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=niro-db-prod
      - DB_NAME=niro
      - DB_USERNAME=${DB_USERNAME:-niro-admin}
      - DB_PASSWORD=${DB_PASSWORD:-db_niro_pwd}
      - REDIS_HOST=niro-redis-prod
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_niro_pwd}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - niro_shared_logs_prod:/app/logs
    networks:
      - niro-data-net-prod

  niro-client-prod:
    build:
      context: ./niro-client
      dockerfile: Dockerfile
    container_name: niro-client-prod
    restart: always
    depends_on:
      niro-web-prod:
        condition: service_healthy
    ports:
      - "81:80" # 生产环境映射到 81，避免与测试环境 80 冲突
    networks:
      - niro-data-net-prod

networks:
  niro-data-net-prod:
    name: niro-data-net-prod
    driver: bridge

volumes:
  niro_db_data_prod:
    name: niro_db_data_prod
  niro_redis_data_prod:
    name: niro_redis_data_prod
  niro_shared_logs_prod:
    name: niro_shared_logs_prod
